name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # torch 走 CPU 版索引，避免在 CI 上拉 CUDA 包（体积大且无用）
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest ruff

      - name: 代码风格检查（ruff）
        run: ruff check . --select F,E9 --exclude .venv,__pycache__

      - name: 运行单元测试
        # 测试不依赖数据集；权重缺失时相关用例自动跳过
        run: python -m pytest tests/ -v
